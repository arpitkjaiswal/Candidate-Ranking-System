name: talentos
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: talentos
      POSTGRES_USER: talentos
      POSTGRES_PASSWORD: ${TALENT_DB_PASSWORD:?Set a database password through your environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentos -d talentos"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  api:
    image: talentos:local
    build: .
    environment:
      TALENT_ENV: production
      TALENT_DEMO: "0"
      TALENT_API_KEY: ${TALENT_API_KEY:?Supply a 32+ character workspace key securely}
      DATABASE_URL: postgresql+psycopg://talentos:${TALENT_DB_PASSWORD:?Set a URL-safe database password}@db:5432/talentos
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports: ["127.0.0.1:${TALENT_HTTP_PORT:-8080}:8080"]
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped
volumes:
  postgres-data:

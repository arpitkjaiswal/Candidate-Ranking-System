name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend migrations scripts tests
      - run: ruff format --check backend migrations scripts tests
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm run format:check
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.lock.txt
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated demo and run browser tests
        run: |
          TALENT_RATE_LIMIT=1000 TALENT_DATA_DIR=/tmp/talentos-ci TALENT_DEMO=1 python -m uvicorn backend.main:app --host 127.0.0.1 --port 8001 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/api/health; then break; fi
            sleep 1
          done
          npm run test:e2e --prefix frontend
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build production image
        run: docker build -t talentos:local .
      - name: Validate PostgreSQL, API, nginx, and restart persistence
        run: python scripts/smoke_compose.py
